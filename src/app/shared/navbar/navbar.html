<header class="navbar" id="main-navbar" (click)="closeNotifPanel()">
 <div class="navbar-inner">
 <!-- Logo -->
 <a routerLink="/" class="navbar-logo" id="navbar-logo">
 <span class="logo-icon-wrapper">
 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
 <polyline points="16 18 22 12 16 6"></polyline>
 <polyline points="8 6 2 12 8 18"></polyline>
 </svg>
 </span>
 <span class="logo-text">CodeSync<span class="logo-accent">.live</span></span>
 </a>

 <!-- Right section -->
 <div class="navbar-actions">
 <a routerLink="/explore" class="nav-link" id="nav-explore">Explore</a>

 <!-- Theme toggle -->
 <button class="theme-toggle" (click)="toggleTheme()" id="theme-toggle-btn" [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
 <ng-container *ngIf="themeService.isDark()">
 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="12" cy="12" r="5"></circle>
 <line x1="12" y1="1" x2="12" y2="3"></line>
 <line x1="12" y1="21" x2="12" y2="23"></line>
 <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
 <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
 <line x1="1" y1="12" x2="3" y2="12"></line>
 <line x1="21" y1="12" x2="23" y2="12"></line>
 <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
 <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
 </svg>
 </ng-container>
 <ng-container *ngIf="!themeService.isDark()">
 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
 </svg>
 </ng-container>
 </button>

 <ng-container *ngIf="(authService.isAuthenticated$ | async); else guestActions">

 <!-- Notification Bell -->
 <div class="notif-wrapper" (click)="$event.stopPropagation()">
 <button class="notif-bell-btn" (click)="toggleNotifPanel()" id="notif-bell-btn"
 [class.notif-active]="showNotifPanel" aria-label="Notifications">
 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
 <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
 </button>

 <!-- Notification Dropdown Panel -->
 <div class="notif-panel glass-panel" *ngIf="showNotifPanel" id="notif-panel">
 <div class="notif-panel-header">
 <span class="notif-title">Notifications</span>
 <div class="notif-header-actions">
 <button class="notif-action-btn" (click)="markAllRead()" *ngIf="unreadCount > 0" title="Mark all as read"> All</button>
 <button class="notif-action-btn danger" (click)="clearAll()" *ngIf="notifications.length > 0" title="Clear all"></button>
 </div>
 </div>

 <div class="notif-list" *ngIf="!isLoadingNotifs">
 <div *ngIf="notifications.length === 0" class="notif-empty">
 <span>No notifications</span>
 <p>You're all caught up!</p>
 </div>

 <div *ngFor="let notif of notifications"
 class="notif-item"
 [class.notif-unread]="!notif.isRead"
 (click)="markAsRead(notif, $event)">
 <div class="notif-icon">{{ getIcon(notif.type) }}</div>
 <div class="notif-body">
 <p class="notif-message notif-msg-title" *ngIf="notif.title">{{ notif.title }}</p>
 <p class="notif-message">{{ notif.message }}</p>
 <span class="notif-time">{{ getTimeAgo(notif.createdAt) }}</span>
 </div>
 <button class="notif-del-btn" (click)="deleteNotif(notif, $event)" title="Dismiss">×</button>
 </div>
 </div>

 <div class="notif-loading" *ngIf="isLoadingNotifs">Loading...</div>
 </div>
 </div>

 <a (click)="goToProfile()" class="profile-chip" id="nav-profile" aria-label="Open your profile" style="cursor:pointer;">
 <span class="profile-avatar" [textContent]="profileInitial"></span>
 <span class="profile-meta">
 <span class="profile-name" [textContent]="currentUser"></span>
 </span>
 </a>

 <button class="logout-btn" (click)="logout()" id="nav-logout" title="Logout">
 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
 <polyline points="16 17 21 12 16 7"></polyline>
 <line x1="21" y1="12" x2="9" y2="12"></line>
 </svg>
 </button>
 </ng-container>
 <ng-template #guestActions>
 <a routerLink="/login" class="btn-get-started" id="nav-get-started">Get started</a>
 </ng-template>
 </div>
 </div>
</header>
